volumes:
  files:
  mysql_data:
  redis_data:
  # clamav:

networks:
  default:
    attachable: true
# mcc:
#   driver: bridge

services:
  #db: use Maria DB as our backend DB
  db:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-db:$AB_DB_VERSION
    environment:
      MYSQL_ROOT_PASSWORD: $MYSQL_PASSWORD
    ports:
      - "3306:3306"
      - "3307:3306"
    volumes:
      # - mysql_config:/etc/mysql/conf.d
      - mysql_data:/var/lib/mysql
      # - mysql_key:/key
    # healthy once init scripts are done and the server takes TCP connections
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  #/db

  #migration: one-off job that applies DB schema patches, then exits.
  # The other services wait for it to finish. The image is amd64 only for now.
  migration:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-migration-manager:${AB_MIGRATION_MANAGER_VERSION:-master}
    platform: linux/amd64
    command: ["node", "app.js"]
    environment:
      - MYSQL_PASSWORD
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
  #/migration

  #nginx setup
  web:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-web:$AB_WEB_VERSION
    hostname: web
    volumes:
      - files:/data
    depends_on:
      - api_sails
    ports:
      - "${WEB_PORT}:80"
      - "443:443"
      - "9229:9229"
  #/nginx

  #redis: use redis to allow cote services to find each other across a swarm
  redis:
    image: docker.io/redis
    ## NOTE: don't expose the service to the outside for security:
    ## if you do expose it, then set a password.
    hostname: redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
  #/redis

  #api_sails: our API end point
  api_sails:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-api-sails:$AB_API_SAILS_VERSION
    # workaround for SELinux bind mount issue (for podman only)
    # security_opt:
    #   label: disable
    environment:
      - COTE_DISCOVERY_REDIS_HOST=redis
      - NODE_ENV=development
      - MYSQL_PASSWORD
      # - MYSQL_HOST
      # - MYSQL_PORT
      # - MYSQL_USER
      # - MYSQL_DBPREFIX
      # - MYSQL_DBADMIN
      # - MYSQL_POOL_MAX
      # - MYSQL_POOL_ACQUIRE_TIMEOUT
      - CAS_ENABLED
      - CAS_BASE_URL
      - CAS_UUID_KEY
      - SITE_URL
      - OKTA_ENABLED
      - OKTA_DOMAIN
      - OKTA_CLIENT_ID
      - OKTA_CLIENT_SECRET
      # - FILE_PROCESSOR_PATH
      # - FILE_PROCESSOR_UPLOAD_DIR
      # - FILE_PROCESSOR_MAXBYTES
      - RELAY_ENABLED
      - RELAY_SERVER_TOKEN
      - SAILS_SESSION_SECRET
    hostname: api_sails
    volumes:
      - type: bind
        source: ./
        target: /var/log/appbuilder/
      - files:/data
    depends_on:
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully
    # command: [ "node", "--inspect=0.0.0.0:9229", "app.js" ]
  #/api_sails

  #appbuilder: (AppBuilder) A multi-tenant aware service to process our AppBuilder requests.
  appbuilder:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-appbuilder:$AB_APPBUILDER_VERSION
    environment:
      - COTE_DISCOVERY_REDIS_HOST=redis
      - MYSQL_PASSWORD
      # - MYSQL_HOST
      # - MYSQL_PORT
      # - MYSQL_USER
      # - MYSQL_DBPREFIX
      # - MYSQL_DBADMIN
      # - MYSQL_POOL_MAX
      # - MYSQL_POOL_ACQUIRE_TIMEOUT
      - APPBUILDER_ENABLE
      - CIRCUITBREAKER_TIMEOUT
      - CIRCUITBREAKER_THRESHHOLD
      - CIRCUITBREAKER_RESET
    hostname: appbuilder
    depends_on:
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully
    # command: [ "node", "--inspect=0.0.0.0:9229", "app.js" ]
  #/appbuilder

  # custom_reports: A microservice for managing custom reports
  custom_reports:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-custom-reports:$AB_CUSTOM_REPORTS_VERSION
    environment:
      - COTE_DISCOVERY_REDIS_HOST=redis
      - MYSQL_PASSWORD
      # - MYSQL_HOST
      # - MYSQL_PORT
      # - MYSQL_USER
      # - MYSQL_DBPREFIX
      # - MYSQL_DBADMIN
      # - MYSQL_POOL_MAX
      # - MYSQL_POOL_ACQUIRE_TIMEOUT
      - CUSTOM_REPORTS_ENABLED
    hostname: custom_reports
    depends_on:
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully
  #/custom_reports

  #definition_manager: (AppBuilder) A service to manage the definitions for a running AppBuilder platform.
  definition_manager:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-definition-manager:$AB_DEFINITION_MANAGER_VERSION
    environment:
      - COTE_DISCOVERY_REDIS_HOST=redis
      - MYSQL_PASSWORD
      # - MYSQL_HOST
      # - MYSQL_PORT
      # - MYSQL_USER
      # - MYSQL_DBPREFIX
      # - MYSQL_DBADMIN
      # - MYSQL_POOL_MAX
      # - MYSQL_POOL_ACQUIRE_TIMEOUT
      - DEFINITION_MANAGER_ENABLE
    hostname: definition_manager
    depends_on:
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully
  #/definition_manager

  #file_processor: A service to manage uploaded files.
  file_processor:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-file-processor:$AB_FILE_PROCESSOR_VERSION
    environment:
      - COTE_DISCOVERY_REDIS_HOST=redis
      - MYSQL_PASSWORD
      # - MYSQL_HOST
      # - MYSQL_PORT
      # - MYSQL_USER
      # - MYSQL_DBPREFIX
      # - MYSQL_DBADMIN
      # - MYSQL_POOL_MAX
      # - MYSQL_POOL_ACQUIRE_TIMEOUT
      - FILE_PROCESSOR_ENABLE
      # - FILE_PROCESSOR_PATH
      # - FILE_PROCESSOR_UPLOAD_DIR
      # - FILE_PROCESSOR_MAXBYTES
      # - CLAMAV_ENABLED
    hostname: file_processor
    volumes:
      - files:/data
      # - clamav:/var/lib/clamav
    depends_on:
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully
  #/file_processor

  #log_manager: (AppBuilder) A log manager for various AB operations
  log_manager:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-log-manager:$AB_LOG_MANAGER_VERSION
    environment:
      - COTE_DISCOVERY_REDIS_HOST=redis
      - MYSQL_PASSWORD
      # - MYSQL_HOST
      # - MYSQL_PORT
      # - MYSQL_USER
      # - MYSQL_DBPREFIX
      # - MYSQL_DBADMIN
      # - MYSQL_POOL_MAX
      # - MYSQL_POOL_ACQUIRE_TIMEOUT
      - SENTRY_ENABLED
      - SENTRY_DSN
      - SENTRY_SAMPLE_RATE
      - SENTRY_SERVER_NAME
      # - SENTRY_CONFIG
    hostname: log_manager
    depends_on:
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully
  #/log_manager

  #notification_email: an smtp email service
  notification_email:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-notification-email:$AB_NOTIFICATION_EMAIL_VERSION
    environment:
      - COTE_DISCOVERY_REDIS_HOST=redis
      - MYSQL_PASSWORD
      # - MYSQL_HOST
      # - MYSQL_PORT
      # - MYSQL_USER
      # - MYSQL_DBPREFIX
      # - MYSQL_DBADMIN
      # - MYSQL_POOL_MAX
      # - MYSQL_POOL_ACQUIRE_TIMEOUT
      - NOTIFICATION_EMAIL_ENABLE
      - NOTIFICATION_EMAIL_DEFAULT
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_SECURE
      # Default Auth Method is "login"
      # specify the user/password
      - SMTP_USER
      - SMTP_PASSWORD
      # For more complicated methods:
      # - SMTP_AUTH="{ login config }"
    hostname: notification_email
    depends_on:
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully
  #/notification_email

  #process_manager: (AppBuilder) a micro service to manage our process tasks
  process_manager:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-process-manager:$AB_PROCESS_MANAGER_VERSION
    environment:
      - COTE_DISCOVERY_REDIS_HOST=redis
      - MYSQL_PASSWORD
      # - MYSQL_HOST
      # - MYSQL_PORT
      # - MYSQL_USER
      # - MYSQL_DBPREFIX
      # - MYSQL_DBADMIN
      # - MYSQL_POOL_MAX
      # - MYSQL_POOL_ACQUIRE_TIMEOUT
    hostname: process_manager
    depends_on:
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully
  #/process_manager

  #relay: (Appbuilder} A service to handle the communications with our relay server.
  relay:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-relay:$AB_RELAY_VERSION
    environment:
      - COTE_DISCOVERY_REDIS_HOST=redis
      - MYSQL_PASSWORD
      - RELAY_ENABLE
      - RELAY_SERVER_URL
      - RELAY_SERVER_TOKEN
      - RELAY_POLL_FREQUENCY
      - RELAY_MAX_PACKET_SIZE
      - PWA_URL
    hostname: relay
    depends_on:
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully
  #/relay

  #tenant_manager: (AppBuilder) A service to manage the site's tenants
  tenant_manager:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-tenant-manager:$AB_TENANT_MANAGER_VERSION
    environment:
      - COTE_DISCOVERY_REDIS_HOST=redis
      - MYSQL_PASSWORD
      - TENANT_MANAGER_ENABLE
      # - TENANT_MANAGER_TENANT_ID
    hostname: tenant_manager
    depends_on:
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully
  #/tenant_manager

  #user_manager: (AppBuilder) A microservice for managing Users
  user_manager:
    image: ${AB_IMAGE_REGISTRY:-ghcr.io/cruglobal-ai}/ab-user-manager:$AB_USER_MANAGER_VERSION
    environment:
      - COTE_DISCOVERY_REDIS_HOST=redis
      - MYSQL_PASSWORD
      - USER_MANAGER_ENABLE
      - USER_MANAGER_MAX_FAILED_LOGINS
    hostname: user_manager
    depends_on:
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully
    # command: [ "node", "--inspect=0.0.0.0:9229", "app.js" ]
  #/user_manager
